<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilustraciones | Portafolio</title>
    <link rel="icon" type="image/x-icon" href="Img/icono.ico">
    <!-- Vinculamos tu CSS -->
    <link rel="stylesheet" href="CSS/ilustracion.css">
</head>
<body>

    <header class="header-subpagina">
        <!-- Botón para regresar -->
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>

        <!-- Banner con la ruta directa sin los dos puntos -->
        <div class="contenedor-banner">
            <img src="Img/bannerweb.png" alt="Welcome to my Art Gallery" class="img-banner-art">
        </div>
    </header>

    <!-- Sección de la Galería -->
<section class="seccion-galeria">
    <div class="grid-galeria">

        <!-- Tarjeta 1 -->
        <div class="tarjeta-arte" onclick="abrirModal('Img/ilustracion/GYARU PROJECT.png')">
            <div class="contenedor-imagen">
                <img src="Img/ilustracion/GYARU PROJECT.png" alt="Ilustración 1" class="img-ilustracion">
                <img src="Img/marcodraw.png" alt="Marco" class="img-marco">
            </div>
            <!-- PON AQUÍ EL NOMBRE DE LA ILUSTRACIÓN 1 -->
            <p class="titulo-ilustracion">Gyaru style 1</p>
        </div>

        <!-- Tarjeta 2 -->
        <div class="tarjeta-arte" onclick="abrirModal('Img/ilustracion/vograce.png')">
            <div class="contenedor-imagen">
                <img src="Img/ilustracion/vograce.png" alt="Ilustración 2" class="img-ilustracion">
                <img src="Img/marcodraw.png" alt="Marco" class="img-marco">
            </div>
            <!-- PON AQUÍ EL NOMBRE DE LA ILUSTRACIÓN 2 -->
            <p class="titulo-ilustracion">Dibujo VOGRACE Concurso 2</p>
        </div>

        <!-- Tarjeta 3 -->
        <div class="tarjeta-arte" onclick="abrirModal('Img/ilustracion/MARCELINElgbt.jpg')">
            <div class="contenedor-imagen">
                <img src="Img/ilustracion/MARCELINElgbt.jpg" alt="Ilustración 3" class="img-ilustracion">
                <img src="Img/marcodraw.png" alt="Marco" class="img-marco">
            </div>
            <!-- PON AQUÍ EL NOMBRE DE LA ILUSTRACIÓN 3 -->
            <p class="titulo-ilustracion"> Marceline la reina vampiro</p>
        </div>

    </div>
</section>

<!-- Modal para ver la imagen a pantalla completa -->
<div id="modal-visor" class="modal-visor" onclick="cerrarModal()">
    <span class="btn-cerrar-modal">&times;</span>
    <img class="imagen-modal-contenido" id="img-modal-ampliada">
</div>

</body>
</html>
